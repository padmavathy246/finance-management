<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Finance Management</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Finance Management Dashboard</h1>

    <!-- DASHBOARD -->

    <div class="dashboard">

        <div class="card">
            <h3>Today Collection</h3>
            <p id="todayCollection">₹0</p>
        </div>

        <div class="card">
            <h3>This Month</h3>
            <p id="monthCollection">₹0</p>
        </div>

        <div class="card">
            <h3>This Month Pending</h3>
            <p id="monthPending">₹0</p>
        </div>

        <div class="card">
            <h3>Total Pending</h3>
            <p id="totalPending">₹0</p>
        </div>

        <div class="card">
            <h3>Total Customers</h3>
            <p id="totalCustomers">0</p>
        </div>

    </div>


    <!-- ADD CUSTOMER -->

    <div class="section">

        <h2>Add Customer</h2>

        <div class="form-grid">

            <input
                type="text"
                id="customerName"
                placeholder="Customer Name"
            >

            <input
                type="tel"
                id="phone"
                placeholder="Phone Number"
            >

            <input
                type="number"
                id="loanAmount"
                placeholder="Loan Amount"
            >

            <input
                type="number"
                id="interestRate"
                placeholder="Interest %"
            >

            <input
                type="number"
                id="loanMonths"
                placeholder="Number of Months"
            >

            <input
                type="date"
                id="loanDate"
            >

        </div>

        <button class="save-btn" onclick="saveCustomer()">
            Save Customer
        </button>

    </div>


    <!-- PAYMENT -->

    <div class="section">

        <h2>Add Payment</h2>

        <div class="form-grid">

            <select id="paymentCustomer">
                <option value="">Select Customer</option>
            </select>

            <input
                type="number"
                id="paymentAmount"
                placeholder="Payment Amount"
            >

            <input
                type="date"
                id="paymentDate"
            >

        </div>

        <button class="payment-btn" onclick="addPayment()">
            Save Payment
        </button>

    </div>


    <!-- MONTH FILTER -->

    <div class="section">

        <h2>Monthly Collection</h2>

        <div class="month-controls">

            <button onclick="changeMonth(-1)">
                ◀ Previous Month
            </button>

            <strong id="selectedMonth"></strong>

            <button onclick="changeMonth(1)">
                Next Month ▶
            </button>

        </div>

        <h3>
            Collection:
            <span id="selectedMonthCollection">₹0</span>
        </h3>

    </div>


    <!-- CUSTOMER LIST -->

    <div class="section">

        <div class="list-header">

            <h2>Customer List</h2>

            <div>

                <button
                    class="excel-btn"
                    onclick="exportExcel()"
                >
                    📊 Export Excel
                </button>

                <button
                    class="all-btn"
                    onclick="showAllCustomers()"
                >
                    👥 View All Customers
                </button>

            </div>

        </div>


        <input
            type="text"
            id="searchCustomer"
            placeholder="Search customer name / phone..."
            oninput="displayCustomers()"
            class="search"
        >


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>No</th>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Loan</th>
                        <th>Total Payable</th>
                        <th>Paid</th>
                        <th>Balance</th>
                        <th>Status</th>
                        <th>Details</th>

                    </tr>

                </thead>

                <tbody id="customerTable">

                </tbody>

            </table>

        </div>

    </div>

</div>


<!-- CUSTOMER DETAILS POPUP -->

<div
    id="customerModal"
    class="modal"
>

    <div class="modal-content">

        <span
            class="close"
            onclick="closeModal()"
        >
            ×
        </span>

        <div id="customerDetails"></div>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
